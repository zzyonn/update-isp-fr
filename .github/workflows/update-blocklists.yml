# A placer dans le depot sous : .github/workflows/update-blocklists.yml
# Le script update_blocklists.py doit etre a la racine du depot.
#
# Les listes sont publiees sur une branche separee "lists", reecrite a chaque
# lancement : le depot ne grossit pas avec l'historique des mises a jour.
name: Mise a jour blocklists

on:
  schedule:
    - cron: '23 */12 * * *'   # 00:23 et 12:23 UTC
  workflow_dispatch:           # bouton de lancement manuel

permissions:
  contents: write

concurrency:
  group: update-blocklists
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # Reprend les listes deja publiees : si une source est en panne,
      # l'ancienne version de la liste concernee est conservee.
      - name: Recuperer les listes actuelles
        run: |
          mkdir -p out
          if git fetch --quiet --depth=1 origin lists 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C out
          fi

      - name: Fusion des listes
        id: merge
        run: |
          set +e
          python3 update_blocklists.py
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      - name: Publication sur la branche lists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          if [ -z "$(ls -A)" ]; then echo "Rien a publier"; exit 0; fi
          git init --quiet -b lists
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --quiet -m "Listes du $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push --quiet --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" lists

      # Fait echouer le job (et declenche le mail de GitHub) si une liste n'a pas pu etre mise a jour
      - name: Statut
        if: steps.merge.outputs.rc != '0'
        run: |
          echo "Au moins une liste n'a pas ete mise a jour, voir l'etape Fusion des listes"
          exit 1
